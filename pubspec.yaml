name: kidguard
description: A feature-rich Android Parental Control application using MVVM architecture.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.2 <4.0.0'
  flutter: '>=3.27.4'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management (MVVM Architecture)
  provider: ^6.1.1

  # Firebase child pairing
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_database: ^12.6.0

  # Dashboard charts and network connectivity
  connectivity_plus: ^7.3.2
  fl_chart: ^1.2.0

  # Live Camera & Audio / Screen Mirroring Streaming
  flutter_webrtc: ^0.9.48

  # Permissions handling for Call logs, Camera, Storage, etc.
  permission_handler: ^11.3.1

  # Local Database to store intercepted messages and notifications
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
