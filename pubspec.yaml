name: kidguard_child
description: "KidGuard Child Protection Client - Android 14+ Native & Flutter Companion"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Device Telemetry & Sensors
  battery_plus: ^6.1.0
  geolocator: ^13.0.1
  device_info_plus: ^10.1.2
  wakelock_plus: ^1.2.8
  permission_handler: ^11.3.1

  # Firebase Realtime Database & Core
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  firebase_auth: ^5.0.0
  shared_preferences: ^2.2.3
  http: ^1.2.2

  # WebRTC & Media Streaming
  flutter_webrtc: ^0.11.7

  # Background Services & OEM Persistence (Android 14 API 34)
  flutter_foreground_task: ^8.1.0

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
